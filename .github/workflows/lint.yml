name: Lint

on:
  push:
    paths-ignore:
      - docs/**
      - '**.md'
      - mkdocs.yml
      - .readthedocs.yaml
  pull_request:
    paths-ignore:
      - docs/**
      - '**.md'
      - mkdocs.yml
      - .readthedocs.yaml

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Cheap and first: a stray binary in the tree breaks every runner upload.
      - name: Verify the committed tree stays small enough for the runner
        run: make verify-tree-size

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
