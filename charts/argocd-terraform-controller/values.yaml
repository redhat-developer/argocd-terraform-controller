# Default values for argocd-terraform-controller.

image:
  repository: quay.io/redhatworkshops/argocd-terraform-controller-manager
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

runner:
  image:
    repository: quay.io/redhatworkshops/argocd-terraform-controller-runner
    # Defaults to the chart appVersion.
    tag: ""
  # Namespaces that host Terraform objects. A tf-runner ServiceAccount and
  # RoleBinding are created in each. The release namespace is always included.
  namespaces: []
  # Create the namespaces listed above when they do not exist yet. Set to
  # false if another tool owns them (Helm would otherwise adopt them and
  # delete them on uninstall).
  createNamespaces: true
  # Extra ClusterRole names to bind to every tf-runner ServiceAccount, e.g.
  # for configurations that manage cluster resources with the kubernetes
  # provider. Use with care.
  extraClusterRoles: []
  # gRPC port and maximum message size (MiB; bounds the source archive size).
  grpcPort: 30000
  grpcMaxMessageSize: 4
  creationTimeout: 2m
  rpcTimeout: 30m

controller:
  replicas: 1
  # Number of Terraform objects reconciled concurrently.
  concurrent: 4
  leaderElection: true
  # Deny dependsOn / cliConfigSecretRef references across namespaces.
  noCrossNamespaceRefs: true
  clusterDomain: cluster.local
  logLevel: info
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

argocd:
  # Namespace of the Argo CD installation.
  namespace: argocd
  # Allow Terraform objects to reuse Argo CD repository credentials
  # (spec.source.git.useArgoCDRepoCredentials). Grants the controller read
  # access to Secrets and ConfigMaps in argocd.namespace.
  repoCredentials:
    enabled: true

  # Integrate with Argo CD automatically. Argo CD's own objects (argocd-cm,
  # the argocd-server Deployment) are not owned by this chart, so a Helm hook
  # Job patches them after install/upgrade and un-patches them before delete.
  # Set enabled: false to do the integration yourself (for example from the
  # Argo CD Helm chart's configs.cm / server.initContainers).
  integration:
    enabled: true
    # Fail the install when Argo CD is not found in argocd.namespace (the
    # namespace, the ConfigMap or the Deployment is missing). With false the
    # hook logs a warning and the controller is installed without integration.
    required: true
    # Undo the patches when the release is uninstalled.
    cleanupOnUninstall: true

    # Health assessment and resource actions (Lua) merged into argocd-cm.
    customizations:
      enabled: true
      configMapName: argocd-cm

    # Argo CD UI extension (sidebar dashboard, tabs) installed through an
    # argocd-extension-installer init container on argocd-server.
    uiExtension:
      enabled: true
      deploymentName: argocd-server
      # Container to mount the extension into. Detected automatically (the
      # first container of the Deployment) when empty: the upstream
      # install.yaml names it "argocd-server", the Argo CD Helm chart "server".
      containerName: ""
      # Release of this project to download the extension from. Defaults to
      # the chart appVersion.
      version: ""
      # Full URLs override the release-derived defaults (air-gapped mirrors).
      extensionURL: ""
      checksumURL: ""
      installer:
        image: quay.io/argoprojlabs/argocd-extension-installer:v0.0.9@sha256:d2b43c18ac1401f579f6d27878f45e253d1e3f30287471ae74e6a4315ceb0611
        # Wait for argocd-server to finish rolling out after the patch.
        waitForRollout: true
        rolloutTimeout: 5m

    # The hook Job that performs the integration.
    hook:
      image: docker.io/alpine/k8s:1.34.1@sha256:ec714df3813b5405292860f8a1c55c5727bf8c33c88992f1e981efad8065547f
      imagePullPolicy: IfNotPresent
      backoffLimit: 3
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 600
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      nodeSelector: {}
      tolerations: []
      podAnnotations: {}

mtls:
  caValidityDuration: 168h
  rotationCheckFrequency: 30m
  lookaheadInterval: 1h

metrics:
  enabled: true
  # Serve metrics over HTTPS protected by authn/authz (controller-runtime filters).
  secure: true
  port: 8443
  serviceMonitor:
    enabled: false
    additionalLabels: {}

imagePullSecrets: []
# The chart is named argocd-terraform-controller-helmchart so it can live in
# its own OCI repository next to the -manager and -runner images. This keeps
# every rendered resource named argocd-terraform-controller regardless.
nameOverride: argocd-terraform-controller
fullnameOverride: ""
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
