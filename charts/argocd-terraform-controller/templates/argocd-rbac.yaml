{{- if and .Values.argocd.repoCredentials.enabled (include "atc.argocd.ready" .) }}
# Lets the controller read Argo CD repository credential Secrets and the SSH
# known hosts ConfigMap for spec.source.git.useArgoCDRepoCredentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "atc.fullname" . }}-argocd-repo-reader
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "atc.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets, configmaps]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "atc.fullname" . }}-argocd-repo-reader
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "atc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "atc.fullname" . }}-argocd-repo-reader
subjects:
- kind: ServiceAccount
  name: {{ include "atc.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
