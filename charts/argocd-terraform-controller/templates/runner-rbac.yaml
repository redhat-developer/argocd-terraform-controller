# Runner Pods write the state Secret, lock Lease, plan and outputs objects in
# the namespace of their Terraform object.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "atc.fullname" . }}-runner
  labels:
    {{- include "atc.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets, configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
{{- range $ns := include "atc.runnerNamespaces" . | fromJsonArray }}
{{- if and $.Values.runner.createNamespaces (ne $ns $.Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "atc.labels" $ | nindent 4 }}
  annotations:
    # Keep the namespace (and whatever teams put in it) when the release is
    # uninstalled; only the runner identity inside it is removed.
    helm.sh/resource-policy: keep
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tf-runner
  namespace: {{ $ns }}
  labels:
    {{- include "atc.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tf-runner
  namespace: {{ $ns }}
  labels:
    {{- include "atc.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "atc.fullname" $ }}-runner
subjects:
- kind: ServiceAccount
  name: tf-runner
  namespace: {{ $ns }}
{{- range $role := $.Values.runner.extraClusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "atc.fullname" $ }}-runner-{{ $ns }}-{{ $role }}
  labels:
    {{- include "atc.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
- kind: ServiceAccount
  name: tf-runner
  namespace: {{ $ns }}
{{- end }}
{{- end }}
