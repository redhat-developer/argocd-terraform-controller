# Optional: lets the controller read Argo CD repository credential Secrets
# and the SSH known hosts ConfigMap, for spec.source.git.useArgoCDRepoCredentials.
# The RoleBinding in config/argocd/argocd_repo_reader_binding.yaml grants it
# in the Argo CD namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: argocd-terraform-controller
    app.kubernetes.io/managed-by: kustomize
  name: argocd-repo-reader
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
