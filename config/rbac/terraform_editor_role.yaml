# This rule is not used by the project argocd-terraform-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the infra.argocd.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: argocd-terraform-controller
    app.kubernetes.io/managed-by: kustomize
  name: terraform-editor-role
rules:
- apiGroups:
  - infra.argocd.io
  resources:
  - terraforms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.argocd.io
  resources:
  - terraforms/status
  verbs:
  - get
