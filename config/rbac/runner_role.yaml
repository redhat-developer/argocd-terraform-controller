# Role for runner Pods. Runners write the Terraform state Secret (Kubernetes
# backend) and lock Lease, the plan Secrets/ConfigMaps and the outputs Secret
# in the namespace of the Terraform object. Bind it to the tf-runner
# ServiceAccount in every namespace that hosts Terraform objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: argocd-terraform-controller
    app.kubernetes.io/managed-by: kustomize
  name: runner-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
